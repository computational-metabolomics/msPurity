name: R-CMD-check-bioc

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  run_covr: 'false'

jobs:
  bioc-config:
    name: Resolve R and Bioconductor
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Test version selection
        run: bash .github/scripts/test-resolve-bioc.sh
      - name: Resolve current versions
        id: resolve
        run: bash .github/scripts/resolve-bioc.sh

  build-check:
    name: ${{ matrix.config.os }} package checks
    needs: bioc-config
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bioc-config.outputs.matrix) }}
    runs-on: ${{ matrix.config.runner }}
    container: ${{ matrix.config.cont }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_BIOC_VERSION: ${{ matrix.config.bioc }}
      EXPECTED_R_MINOR: ${{ matrix.config.r_minor }}
      NOT_CRAN: 'true'
      TZ: UTC
      BIOCPARALLEL_WORKER_MAX: '2'
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          install-r: ${{ runner.os != 'Linux' }}
          Ncpus: '2'
          use-public-rspm: true

      - name: Set up reference-library paths
        shell: Rscript {0}
        run: |
          paths <- c(
              BFC_CACHE = file.path(Sys.getenv("RUNNER_TEMP"), "mspurity-bfc"),
              MSPURITY_REFERENCE = file.path(Sys.getenv("RUNNER_TEMP"),
                  "mspurity-reference", "library_spectra.db"))
          writeLines(paste(names(paths), paths, sep = "="),
              Sys.getenv("GITHUB_ENV"))

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: '2'
          dependencies: '"all"'
          upgrade: 'TRUE'
          extra-packages: |
            any::BiocManager
            any::BiocVersion
            any::BiocCheck
            any::rcmdcheck

      - name: Verify versions and Parquet dependencies
        shell: Rscript {0}
        run: |
          actual_r <- paste(R.version$major,
              strsplit(R.version$minor, ".", fixed = TRUE)[[1]][1], sep = ".")
          stopifnot(actual_r == Sys.getenv("EXPECTED_R_MINOR"),
              packageVersion("BiocVersion") ==
                  package_version(Sys.getenv("R_BIOC_VERSION")),
              as.character(BiocManager::version()) == Sys.getenv("R_BIOC_VERSION"))
          for (package in c("arrow", "MsBackendParquet")) {
              if (!requireNamespace(package, quietly = TRUE))
                  stop("Required Parquet test dependency cannot load: ", package)
          }
          stopifnot(packageVersion("MsBackendParquet") >= "0.99.7",
              arrow::codec_is_available("zstd"), arrow::codec_is_available("snappy"))
          write.csv(installed.packages()[, c("Package", "Version", "Built")],
              "ci-packages.csv", row.names = FALSE)
          capture.output(sessionInfo(), file = "ci-sessionInfo.txt")

      - name: Cache reference-library download
        uses: actions/cache@v4
        with:
          path: ${{ env.MSPURITY_REFERENCE }}
          key: mspurity-library-f6a4033d376278cccfc30d1911fb2fa5

      - name: Prepare reference library
        shell: Rscript {0}
        run: |
          path <- Sys.getenv("MSPURITY_REFERENCE")
          dir.create(dirname(path), recursive = TRUE, showWarnings = FALSE)
          if (!file.exists(path)) {
              download.file(
                  "https://zenodo.org/records/18700802/files/library_spectra.db?download=1",
                  path, mode = "wb", method = "libcurl")
          }
          stopifnot(unname(tools::md5sum(path)) == "f6a4033d376278cccfc30d1911fb2fa5")
          cache <- BiocFileCache::BiocFileCache(ask = FALSE)
          name <- "msPurity_library_spectra_db"
          if (!nrow(BiocFileCache::bfcquery(cache, name, "rname", exact = TRUE)))
              BiocFileCache::bfcadd(cache, name, path, rtype = "local", action = "asis")

      - name: Run R CMD check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
              args = c("--no-manual", "--no-vignettes", "--timings"),
              build_args = c("--no-manual", "--keep-empty-dirs", "--no-resave-data"),
              error_on = "warning", check_dir = "check")

      - name: Run BiocCheck
        shell: Rscript {0}
        run: |
          tarball <- list.files("check", "[.]tar[.]gz$", full.names = TRUE)
          stopifnot(length(tarball) == 1L)
          BiocCheck::BiocCheck(tarball, checkDir = "check", callr = FALSE,
              `no-check-R-ver` = TRUE, `no-check-bioc-help` = TRUE,
              `no-check-pkg-size` = TRUE, `quit-with-status` = TRUE)

      - name: Install covr
        if: env.run_covr == 'true' && github.ref == 'refs/heads/master' && runner.os == 'Linux'
        shell: Rscript {0}
        run: install.packages("covr")

      - name: Test coverage
        if: env.run_covr == 'true' && github.ref == 'refs/heads/master' && runner.os == 'Linux'
        shell: Rscript {0}
        run: covr::codecov()

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.config.os }}
          path: |
            check
            ci-packages.csv
            ci-sessionInfo.txt
          if-no-files-found: warn

# Future: consider adopting https://github.com/Bioconductor/workflows.
