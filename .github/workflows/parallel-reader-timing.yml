name: Parallel reader timing

on:
  push:
    branches: [ci-windows-test-timing]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bioc-config:
    name: Resolve R and Bioconductor
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current versions
        id: resolve
        run: bash .github/scripts/resolve-bioc.sh

  parallel-reader-timing:
    name: ${{ matrix.config.os }} parallel reader
    needs: bioc-config
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bioc-config.outputs.matrix) }}
    runs-on: ${{ matrix.config.runner }}
    container: ${{ matrix.config.cont }}
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_BIOC_VERSION: ${{ matrix.config.bioc }}
      EXPECTED_R_MINOR: ${{ matrix.config.r_minor }}
      NOT_CRAN: 'true'
      TZ: UTC
      BIOCPARALLEL_WORKER_MAX: '2'
    steps:
      - name: Preserve fixture line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          install-r: ${{ runner.os != 'Linux' }}
          Ncpus: '2'
          use-public-rspm: true

      - name: Set up macOS OpenSSL
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          openssl_prefix=$(brew --prefix openssl@3)
          echo "LIBRARY_PATH=$openssl_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: '2'
          dependencies: '"all"'
          upgrade: 'TRUE'
          extra-packages: |
            any::BiocManager
            any::BiocVersion
            any::BiocCheck
            any::rcmdcheck

      - name: Verify versions and install package with tests
        shell: Rscript {0}
        run: |
          actual_r <- paste(R.version$major,
              strsplit(R.version$minor, ".", fixed = TRUE)[[1]][1], sep = ".")
          stopifnot(actual_r == Sys.getenv("EXPECTED_R_MINOR"),
              packageVersion("BiocVersion") ==
                  package_version(Sys.getenv("R_BIOC_VERSION")),
              as.character(BiocManager::version()) == Sys.getenv("R_BIOC_VERSION"))
          for (package in c("arrow", "MsBackendParquet", "MsBackendMsp")) {
              if (!requireNamespace(package, quietly = TRUE))
                  stop("Required test dependency cannot load: ", package)
          }
          stopifnot(packageVersion("MsBackendParquet") >= "0.99.7",
              arrow::codec_is_available("zstd"), arrow::codec_is_available("snappy"))
          status <- system2(file.path(R.home("bin"), "R"),
              c("CMD", "INSTALL", "--install-tests",
                paste0("--library=", shQuote(.libPaths()[1])), "."))
          stopifnot(status == 0L)

      - name: Time the focused parallel reader test
        shell: Rscript {0}
        env:
          TIMING_OUTPUT: ${{ runner.temp }}/mspurity-parallel-reader-timing
        run: source(".github/scripts/time-parallel-reader.R")

      - name: Upload timings and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-reader-timing-${{ matrix.config.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/mspurity-parallel-reader-timing
          if-no-files-found: warn
